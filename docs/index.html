<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Engage Media | Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #41B6E6;
      --base-background-color: #05070F;
      --base-color: #F4F7FB;
      --heading-color: #F4F7FB;
      --font-family-base: 'Poppins', -apple-system, sans-serif;
      --font-family-code: 'Poppins', monospace;
      --link-color: #41B6E6;
      --cover-background-color: #05070F;
    }
    body { background: var(--base-background-color); }

    .docs-topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 68px;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 20px;
      padding: 0 28px;
      background: #0A0F24;
      border-bottom: 1px solid rgba(65,182,230,0.22);
      font-family: 'Poppins', -apple-system, sans-serif;
    }
    .docs-topbar-brand {
      display: flex;
      align-items: center;
      margin-right: 4px;
    }
    .docs-topbar img {
      height: 36px; width: 36px;
      filter: drop-shadow(0 0 4px rgba(65,182,230,0.9)) drop-shadow(0 0 10px rgba(65,182,230,0.4));
    }
    .docs-topbar a {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none;
      color: #F4F7FB;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
    }
    .docs-topbar a:hover { color: #41B6E6; }

    /* Hide default Docsify sidebar controls */
    .sidebar, .sidebar-toggle { display: none !important; }

    .content {
      top: 68px !important;
      left: 0 !important;
      transition: margin-left 250ms ease-out !important;
    }
    
    /* Shift main content dynamically based on sidebar state */
    body.em-sidebar-open .content {
      margin-left: 300px !important;
    }
    @media screen and (max-width: 768px) {
      body.em-sidebar-open .content {
        margin-left: 0 !important;
      }
    }

    /* Custom Sidebar Styles */
    .em-sidebar {
      position: fixed;
      top: 68px; bottom: 0; left: 0;
      width: 300px;
      background: #0D1224;
      border-right: 1px solid rgba(65, 182, 230, 0.25);
      overflow: visible; /* Allows toggle button tab to sit outside border */
      padding: 20px 0 40px;
      font-family: 'Poppins', -apple-system, sans-serif;
      transform: translateX(-100%);
      transition: transform 250ms ease-out;
      z-index: 25;
      text-align: left;
      box-sizing: border-box;
    }
    
    /* Open state class controls visibility across desktop and mobile */
    body.em-sidebar-open .em-sidebar {
      transform: translateX(0) !important;
    }

    .em-sidebar-search {
      display: block;
      margin: 4px 20px 20px;
      padding: 10px 14px;
      width: calc(100% - 40px);
      background: #131A33;
      border: 1px solid rgba(65, 182, 230, 0.25);
      border-radius: 8px;
      color: #F4F7FB;
      font-family: inherit;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    .em-sidebar-search::placeholder { color: #8B93B8; }
    .em-sidebar-search:focus { outline: none; border-color: #41B6E6; }

    /* Section label formatted as a clickable Home link */
    .em-sidebar-label {
      display: block;
      margin: 0 20px 8px;
      padding: 0 12px;
      color: #6B7494;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: left;
      text-decoration: none;
      transition: color 150ms ease;
    }
    .em-sidebar-label:hover {
      color: #41B6E6;
    }

    .em-sidebar-nav {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .em-sidebar-nav li {
      margin: 2px 12px;
      width: auto;
    }
    .em-sidebar-nav a {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 8px;
      border-left: 3px solid transparent;
      color: #C7CEEB;
      text-decoration: none;
      text-align: left;
      font-weight: 500;
      font-size: 0.95rem;
      line-height: 1.3;
    }
    .em-sidebar-nav a:hover {
      color: #FFFFFF;
      background: rgba(65, 182, 230, 0.08);
    }
    .em-sidebar-nav a.em-active {
      color: #41B6E6;
      background: rgba(65, 182, 230, 0.12);
      border-left-color: #41B6E6;
      font-weight: 600;
    }

    .em-sidebar-empty {
      margin: 4px 20px;
      color: #6B7494;
      font-size: 0.85rem;
      font-family: 'Poppins', -apple-system, sans-serif;
      text-align: left;
    }

    /* Edge-Centered Tab Toggle Button */
    .em-sidebar-toggle {
      position: absolute;
      top: 50%;
      /* Position tab completely outside when closed, flush when open */
      right: -36px;
      transform: translateY(-50%);
      z-index: 35;
      width: 36px;
      height: 44px;
      border: 1px solid rgba(65, 182, 230, 0.4);
      border-left: none; /* Flushes seamlessly with sidebar edge */
      border-radius: 0 8px 8px 0;
      background: #0D1224;
      color: #41B6E6;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 200ms ease;
      box-shadow: 4px 0 12px rgba(65, 182, 230, 0.25), 2px 0 8px rgba(0,0,0,0.5);
    }
    
    /* When sidebar is open, adjust position to sit directly on border */
    body.em-sidebar-open .em-sidebar-toggle {
      right: -37px;
    }

    .em-sidebar-toggle:hover {
      background: #131A33;
      border-color: #41B6E6;
      color: #FFFFFF;
      box-shadow: 6px 0 16px rgba(65, 182, 230, 0.45);
    }

    .em-sidebar-toggle svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 250ms ease;
    }

    /* Rotate arrow: points left (<) when open, points right (>) when closed */
    body.em-sidebar-open .em-sidebar-toggle svg {
      transform: rotate(180deg);
    }

    .em-sidebar-backdrop {
      display: none;
      position: fixed;
      top: 68px; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 24;
    }
    @media screen and (max-width: 768px) {
      body.em-sidebar-open .em-sidebar-backdrop { display: block; }
    }

    /* Dark Mode Text Rules */
    body { color: #D7DEF5 !important; }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section strong { color: #F7F9FF !important; }
    .markdown-section p,
    .markdown-section li { color: #D7DEF5 !important; }
    .markdown-section h6,
    .markdown-section blockquote,
    .markdown-section em { color: #9AA4CC !important; }
  </style>
</head>
<body class="em-sidebar-open">
  <!-- Top bar aligned to far left: Logo -> Tools Portal -->
  <div class="docs-topbar">
    <div class="docs-topbar-brand">
      <img src="../assets/logo.svg" alt="Engage Media Logo" />
    </div>
    <a href="https://dataengagemedia.github.io/engage-media-tools-portal-pilot/">
      <span>Tools Portal</span>
    </a>
  </div>

  <div class="em-sidebar-backdrop"></div>

  <!-- Sidebar -->
  <nav class="em-sidebar">
    <!-- Visible Tab Toggle Button inside Sidebar -->
    <button class="em-sidebar-toggle" type="button" aria-label="Toggle navigation">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>

    <input class="em-sidebar-search" type="text" placeholder="Type to search" />
    <a href="#/" class="em-sidebar-label">Home</a>
    <ul class="em-sidebar-nav">
      <li><a href="#/ai-insight-editor">AI Insight Editor</a></li>
    </ul>
    <p class="em-sidebar-empty" hidden>No matches.</p>
  </nav>

  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Engage Media Docs',
      loadSidebar: false,
      subMaxLevel: 2
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script>
    (function () {
      function ready(fn) {
        if (document.readyState !== 'loading') fn();
        else document.addEventListener('DOMContentLoaded', fn);
      }

      ready(function () {
        var toggleBtn = document.querySelector('.em-sidebar-toggle');
        var backdrop = document.querySelector('.em-sidebar-backdrop');
        var sidebar = document.querySelector('.em-sidebar');
        var searchInput = document.querySelector('.em-sidebar-search');
        var navItems = Array.prototype.slice.call(sidebar.querySelectorAll('.em-sidebar-nav li'));
        var emptyMsg = document.querySelector('.em-sidebar-empty');

        function isOpen() {
          return document.body.classList.contains('em-sidebar-open');
        }
        function openSidebar() {
          document.body.classList.add('em-sidebar-open');
        }
        function closeSidebar() {
          document.body.classList.remove('em-sidebar-open');
        }

        if (toggleBtn) {
          toggleBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            isOpen() ? closeSidebar() : openSidebar();
          });
        }
        if (backdrop) {
          backdrop.addEventListener('click', closeSidebar);
        }

        /* Close sidebar when clicking anywhere on page except sidebar and topbar */
        document.addEventListener('click', function (e) {
          if (!isOpen()) return;

          var clickedSidebar = e.target.closest('.em-sidebar');
          var clickedTopbar = e.target.closest('.docs-topbar');

          if (!clickedSidebar && !clickedTopbar) {
            closeSidebar();
          }
        });

        if (searchInput) {
          searchInput.addEventListener('input', function () {
            var query = searchInput.value.trim().toLowerCase();
            var anyVisible = false;

            navItems.forEach(function (li) {
              var text = li.textContent.trim().toLowerCase();
              var matches = query === '' || text.indexOf(query) !== -1;
              li.hidden = !matches;
              if (matches) {
                anyVisible = true;
              }
            });

            emptyMsg.hidden = anyVisible;
          });
        }

        function markActiveLink() {
          var currentHash = location.hash || '#/';

          navItems.forEach(function (li) {
            var link = li.querySelector('a');
            if (!link) {
              return;
            }
            var isActive = link.getAttribute('href') === currentHash;
            link.classList.toggle('em-active', isActive);
          });
        }

        window.addEventListener('hashchange', markActiveLink);
        markActiveLink();
      });
    })();
  </script>
</body>
</html>
