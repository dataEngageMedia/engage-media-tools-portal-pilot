<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Engage Media | Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #41B6E6;
      --base-background-color: #05070F;
      --base-color: #F4F7FB;
      --heading-color: #F4F7FB;
      --font-family-base: 'Poppins', -apple-system, sans-serif;
      --font-family-code: 'Poppins', monospace;
      --link-color: #41B6E6;
      --cover-background-color: #05070F;
    }
    body { background: var(--base-background-color); }

    .docs-topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 68px;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 0 28px;
      background: #0A0F24;
      border-bottom: 1px solid rgba(65,182,230,0.22);
      font-family: 'Poppins', -apple-system, sans-serif;
    }
    .docs-topbar img {
      height: 36px; width: 36px;
      filter: drop-shadow(0 0 4px rgba(65,182,230,0.9)) drop-shadow(0 0 10px rgba(65,182,230,0.4));
    }
    .docs-topbar a {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
      color: #F4F7FB;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
    }
    .docs-topbar a:hover { color: #41B6E6; }

    /* ---------------------------------------------------------------------
       Docsify's own sidebar and toggle button are hidden completely, not
       just restyled. This is a from-scratch rebuild: after three rounds of
       trying to override or intercept Docsify's built-in sidebar-close
       behavior and hitting a different internal quirk each time, the only
       way to be fully certain no Docsify-internal script can ever close our
       navigation is to make sure a real click can never land on anything
       Docsify itself controls. Docsify still renders its own sidebar/toggle
       in the background (harmless -- it's invisible and unreachable), while
       everything the user actually sees and clicks below (.em-sidebar,
       .em-sidebar-toggle, .em-sidebar-backdrop) is plain markup and script
       written here, with no shared class names and no code path that lets
       Docsify attach anything to it.
    --------------------------------------------------------------------- */
    .sidebar, .sidebar-toggle { display: none !important; }

    .content {
      top: 68px !important;
      left: 0 !important;
      transition: none !important;
    }
    @media screen and (min-width: 769px) {
      .content { left: 300px !important; }
    }

    .em-sidebar {
      position: fixed;
      top: 68px; bottom: 0; left: 0;
      width: 300px;
      background: #0D1224;
      border-right: 1px solid rgba(65, 182, 230, 0.15);
      overflow-y: auto;
      padding: 20px 0 40px;
      font-family: 'Poppins', -apple-system, sans-serif;
      transform: translateX(-100%);
      transition: transform 250ms ease-out;
      z-index: 25;
    }
    @media screen and (min-width: 769px) {
      .em-sidebar { transform: translateX(0) !important; }
    }
    body.em-sidebar-open .em-sidebar {
      transform: translateX(0);
    }

    .em-sidebar-search {
      display: block;
      margin: 0 20px 16px;
      padding: 10px 14px;
      width: calc(100% - 68px);
      background: #131A33;
      border: 1px solid rgba(65, 182, 230, 0.25);
      border-radius: 8px;
      color: #F4F7FB;
      font-family: inherit;
      font-size: 0.9rem;
    }
    .em-sidebar-search::placeholder { color: #8B93B8; }
    .em-sidebar-search:focus { outline: none; border-color: #41B6E6; }

    .em-sidebar-nav {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .em-sidebar-nav li { margin: 2px 12px; }
    .em-sidebar-nav a {
      display: block;
      padding: 10px 12px;
      border-radius: 8px;
      color: #C7CEEB;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
    }
    .em-sidebar-nav a:hover { color: #FFFFFF; background: rgba(65, 182, 230, 0.08); }
    .em-sidebar-nav a.em-active { color: #41B6E6; background: rgba(65, 182, 230, 0.12); }

    .em-sidebar-empty {
      margin: 4px 20px;
      color: #6B7494;
      font-size: 0.85rem;
      font-family: 'Poppins', -apple-system, sans-serif;
    }

    .em-sidebar-toggle {
      position: fixed;
      top: 14px; left: 16px;
      z-index: 41;
      width: 40px; height: 40px;
      border: none;
      border-radius: 8px;
      background: rgba(65, 182, 230, 0.14);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .em-sidebar-toggle:hover { background: rgba(65, 182, 230, 0.24); }
    .em-sidebar-toggle-bar,
    .em-sidebar-toggle-bar::before,
    .em-sidebar-toggle-bar::after {
      content: '';
      display: block;
      width: 18px; height: 2px;
      background: #F4F7FB;
      border-radius: 1px;
    }
    .em-sidebar-toggle-bar { position: relative; }
    .em-sidebar-toggle-bar::before { position: absolute; top: -6px; }
    .em-sidebar-toggle-bar::after { position: absolute; top: 6px; }

    .em-sidebar-backdrop {
      display: none;
      position: fixed;
      top: 68px; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 24;
    }
    body.em-sidebar-open .em-sidebar-backdrop { display: block; }

    @media screen and (max-width: 768px) {
      .em-sidebar-toggle { display: flex; }
      .docs-topbar { padding-left: 64px; }
    }
    @media screen and (min-width: 769px) {
      .em-sidebar-backdrop { display: none !important; }
    }

    /* Readable text against our dark background -- Docsify's vue theme
       hardcodes colors meant for a white page. */
    body { color: #D7DEF5 !important; }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section strong { color: #F7F9FF !important; }
    .markdown-section p,
    .markdown-section li { color: #D7DEF5 !important; }
    .markdown-section h6,
    .markdown-section blockquote,
    .markdown-section em { color: #9AA4CC !important; }
  </style>
</head>
<body>
  <div class="docs-topbar">
    <a href="https://dataengagemedia.github.io/engage-media-tools-portal-pilot/">
      <span>Home</span>
      <img src="../assets/logo.svg" alt="" />
    </a>
  </div>

  <button class="em-sidebar-toggle" type="button" aria-label="Toggle navigation">
    <span class="em-sidebar-toggle-bar"></span>
  </button>

  <div class="em-sidebar-backdrop"></div>

  <nav class="em-sidebar">
    <input class="em-sidebar-search" type="text" placeholder="Type to search" />
    <ul class="em-sidebar-nav">
      <li><a href="#/">Home</a></li>
      <li><a href="#/ai-insight-editor">AI Insight Editor</a></li>
    </ul>
    <p class="em-sidebar-empty" hidden>No matches.</p>
  </nav>

  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Engage Media Docs',
      loadSidebar: false,
      subMaxLevel: 2
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script>
    (function () {
      function ready(fn) {
        if (document.readyState !== 'loading') fn();
        else document.addEventListener('DOMContentLoaded', fn);
      }

      ready(function () {
        var toggleBtn = document.querySelector('.em-sidebar-toggle');
        var backdrop = document.querySelector('.em-sidebar-backdrop');
        var sidebar = document.querySelector('.em-sidebar');
        var searchInput = document.querySelector('.em-sidebar-search');
        var navItems = Array.prototype.slice.call(sidebar.querySelectorAll('.em-sidebar-nav li'));
        var emptyMsg = document.querySelector('.em-sidebar-empty');

        function isOpen() {
          return document.body.classList.contains('em-sidebar-open');
        }
        function openSidebar() {
          document.body.classList.add('em-sidebar-open');
        }
        function closeSidebar() {
          document.body.classList.remove('em-sidebar-open');
        }

        // Our toggle button, our backdrop, our sidebar -- none of this is
        // Docsify's own UI, so there is no other script anywhere that can
        // react to clicks on it besides the listeners below.
        if (toggleBtn) {
          toggleBtn.addEventListener('click', function () {
            isOpen() ? closeSidebar() : openSidebar();
          });
        }
        if (backdrop) {
          backdrop.addEventListener('click', closeSidebar);
        }

        // Close on a click anywhere outside our sidebar and its toggle
        // button. Clicks on nav links or the search box are never touched.
        document.addEventListener('click', function (e) {
          if (!isOpen()) {
            return;
          }
          if (e.target.closest('.em-sidebar') || e.target.closest('.em-sidebar-toggle')) {
            return;
          }
          closeSidebar();
        });

        // Simple client-side filter: as you type, hide nav items whose text
        // doesn't match. With only a couple of pages today this is plenty --
        // it grows automatically as pages are added to the list above,
        // with no separate search index to keep in sync.
        if (searchInput) {
          searchInput.addEventListener('input', function () {
            var query = searchInput.value.trim().toLowerCase();
            var anyVisible = false;

            navItems.forEach(function (li) {
              var text = li.textContent.trim().toLowerCase();
              var matches = query === '' || text.indexOf(query) !== -1;
              li.hidden = !matches;
              if (matches) {
                anyVisible = true;
              }
            });

            emptyMsg.hidden = anyVisible;
          });
        }

        // Highlight whichever nav link matches the current page, both on
        // load and whenever Docsify's router changes the hash.
        function markActiveLink() {
          var currentHash = location.hash || '#/';

          navItems.forEach(function (li) {
            var link = li.querySelector('a');
            if (!link) {
              return;
            }
            var isActive = link.getAttribute('href') === currentHash;
            link.classList.toggle('em-active', isActive);
          });
        }

        window.addEventListener('hashchange', markActiveLink);
        markActiveLink();
      });
    })();
  </script>
</body>
</html>
