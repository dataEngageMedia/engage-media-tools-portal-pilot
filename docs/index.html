<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Engage Media | Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- TODO: once brand colors land, add a small <style> override here (docsify reads CSS vars like --theme-color) -->
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Engage Media Docs',
      loadSidebar: true,
      subMaxLevel: 2,
      search: 'auto'
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
