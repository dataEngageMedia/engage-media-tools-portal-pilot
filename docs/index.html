<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Engage Media | Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #41B6E6;
      --base-background-color: #05070F;
      --base-color: #F4F7FB;
      --sidebar-background: #0D1224;
      --sidebar-nav-link-color: #8B93B8;
      --sidebar-nav-link-color--active: #41B6E6;
      --heading-color: #F4F7FB;
      --font-family-base: 'Poppins', -apple-system, sans-serif;
      --font-family-code: 'Poppins', monospace;
      --link-color: #41B6E6;
      --cover-background-color: #05070F;
    }
    body { background: var(--base-background-color); }
    .docs-topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 68px;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 0 28px;
      background: #0A0F24;
      border-bottom: 1px solid rgba(65,182,230,0.22);
      font-family: 'Poppins', -apple-system, sans-serif;
    }
    .docs-topbar img {
      height: 36px; width: 36px;
      filter: drop-shadow(0 0 4px rgba(65,182,230,0.9)) drop-shadow(0 0 10px rgba(65,182,230,0.4));
    }
    .docs-topbar a {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
      color: #F4F7FB;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
    }
    .docs-topbar a:hover { color: #41B6E6; }
    .sidebar, .content, .sidebar-toggle { top: 68px !important; }

    /* Docsify's vue theme hardcodes sidebar colors (#fff bg, #505d6b text) instead of
       reading our --sidebar-* custom properties, which is why the text was unreadable
       against our dark theme. Overriding the real selectors directly, not the unused vars. */
    .sidebar { background-color: #0D1224 !important; }
    .sidebar > h1 a { color: #F4F7FB !important; }
    .sidebar ul li a { color: #C7CEEB !important; font-weight: 500; }
    .sidebar ul li a:hover { color: #FFFFFF !important; }
    .sidebar ul li.active > a { color: #41B6E6 !important; }
    .sidebar li > p { color: #F4F7FB !important; }

    /* Docsify's vue theme puts a translucent white background on the mobile
       sidebar-toggle button (both the default and the "closed" state) — removing it. */
    .sidebar-toggle,
    body.close .sidebar-toggle {
      background-color: transparent !important;
    }

    /* Same root cause as the sidebar: vue theme hardcodes body/heading text colors
       (#34495e, #2c3e50) meant for a white page, so they were nearly invisible
       against our dark background. Overriding with light, readable colors. */
    body { color: #D7DEF5 !important; }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section strong { color: #F7F9FF !important; }
    .markdown-section p,
    .markdown-section li { color: #D7DEF5 !important; }
    .markdown-section h6,
    .markdown-section blockquote,
    .markdown-section em { color: #9AA4CC !important; }

    /* ---------------------------------------------------------------------
       Sidebar open/close: rebuilt from scratch, independent of Docsify.

       Docsify's own mobile sidebar toggle works by adding/removing a "close"
       class on <body> from a single click listener attached to the whole
       body, with no check of what was actually clicked -- confirmed by
       reading Docsify v4.13.1's real source (src/core/event/sidebar.js).
       That's what kept closing the sidebar the instant you clicked a link,
       the search box, or anything else inside it, no matter how we tried to
       intercept it.

       Instead of continuing to fight Docsify's internal listener, this
       ignores it completely: our own "em-sidebar-open" class controls
       visibility, our own toggle button listener sets it, and our own
       document click listener is the only thing that ever closes it -- and
       it only fires for clicks that are demonstrably outside the sidebar
       and its toggle button. Docsify's own "close" class still gets
       toggled internally in the background, but nothing on the page reads
       it anymore, so it can't affect what's on screen.
    --------------------------------------------------------------------- */
    @media screen and (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%) !important;
        transition: transform 250ms ease-out !important;
      }
      body.em-sidebar-open .sidebar {
        transform: translateX(0) !important;
      }
      .content {
        transform: none !important;
        transition: none !important;
      }
      .em-sidebar-backdrop {
        display: none;
        position: fixed;
        top: 68px; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 15;
      }
      body.em-sidebar-open .em-sidebar-backdrop {
        display: block;
      }
    }
    @media screen and (min-width: 769px) {
      .em-sidebar-backdrop { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="docs-topbar">
    <a href="https://dataengagemedia.github.io/engage-media-tools-portal-pilot/">
      <span>Home</span>
      <img src="../assets/logo.svg" alt="" />
    </a>
  </div>
  <div class="em-sidebar-backdrop"></div>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Engage Media Docs',
      loadSidebar: true,
      subMaxLevel: 2,
      search: 'auto'
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script>
    (function () {
      function ready(fn) {
        if (document.readyState !== 'loading') fn();
        else document.addEventListener('DOMContentLoaded', fn);
      }

      ready(function () {
        var backdrop = document.querySelector('.em-sidebar-backdrop');
        var toggleBtn = document.querySelector('.sidebar-toggle');

        function isOpen() {
          return document.body.classList.contains('em-sidebar-open');
        }
        function openSidebar() {
          document.body.classList.add('em-sidebar-open');
        }
        function closeSidebar() {
          document.body.classList.remove('em-sidebar-open');
        }

        // The toggle button is rendered by Docsify itself, and Docsify's own
        // click handler on it calls stopPropagation() -- so a listener
        // registered on document (delegation) never sees this click at all.
        // Attaching directly to the button itself runs alongside Docsify's
        // own handler regardless (stopPropagation only blocks propagation to
        // OTHER elements, never other listeners on the same element).
        if (toggleBtn) {
          toggleBtn.addEventListener('click', function () {
            isOpen() ? closeSidebar() : openSidebar();
          });
        }

        // Tapping the dimmed backdrop behind the open sidebar closes it.
        if (backdrop) {
          backdrop.addEventListener('click', closeSidebar);
        }

        // Any other click outside the sidebar (and outside its toggle
        // button) closes it. Clicks inside the sidebar -- links, the search
        // box, anything -- are never touched by this listener, so they
        // behave exactly like normal clicks with no interference.
        document.addEventListener('click', function (e) {
          if (!isOpen()) {
            return;
          }
          if (e.target.closest('.sidebar') || e.target.closest('.sidebar-toggle')) {
            return;
          }
          closeSidebar();
        });
      });
    })();
  </script>
</body>
</html>
